name: 💡 Feature Request
description: Suggest a new idea, enhancement, or feature for the Spotlight Launcher mod.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        ### Share your idea! 🚀
        Thank you for proposing new features to improve the Spotlight Launcher. Please describe your request in detail so we can understand the goal and use case.

  - type: textarea
    id: problem-link
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem or limitation is (e.g., "I'm always frustrated when...").
      placeholder: |
        e.g., Currently, the launcher closes too quickly when I misstype a command, and I have to reopen it and retype everything.
    validations:
      required: false

  - type: textarea
    id: solution-description
    attributes:
      label: Describe the desired solution
      description: Provide a clear and concise description of what you want to happen. What features or changes would you like to see?
      placeholder: |
        e.g., It would be great to have an option in the Windhawk settings to keep the search bar open for a few seconds even if the query yields no results, or allow a history feature.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Have you considered any alternative solutions, workarounds, or external tools?
      placeholder: |
        e.g., I tried changing the hotkey or adjusting the vertical position, but it doesn't solve the core issue.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context or visual examples
      description: Add any other context, mockup designs, or screenshots about the feature request here.
      placeholder: You can drag and drop your concept images or sketches directly here.

  - type: checkboxes
    id: submit-pr
    attributes:
      label: Are you willing to submit a PR?
      description: >
        (Optional) We encourage you to open a [Pull Request](https://github.com) if you are interested in coding this feature or improvement yourself!
      options:
        - label: Yes, I'd like to help by submitting a PR!
